[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "invoist"
version = "1.0.1"
description = "The official Python library for the Invoist API: read invoices and receipts into structured data, and work with a household's bills."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Invoist" }]
keywords = ["invoist", "invoice", "receipt", "ocr", "extraction", "bills", "api", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.14.2,<3",
  "typing-extensions>=4.14.1",
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator==0.87.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "build==1.6.1",
  "twine==7.0.0",
  "types-PyYAML==6.0.12.20261030",
]

[project.urls]
Homepage = "https://invoi.st/docs"
Documentation = "https://invoi.st/docs"
Repository = "https://github.com/invoisthq/invoist-python"
Issues = "https://github.com/invoisthq/invoist-python/issues"
Changelog = "https://github.com/invoisthq/invoist-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
  "invoist",
  "tests",
  "testdata",
  "scripts",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["invoist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["invoist/_generated", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "ASYNC", "S", "D"]
ignore = [
  "D105",  # magic methods document themselves
  "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]
"scripts/**" = ["S603", "S607"]
# The spec names this option `timeout` in every language; it bounds polling, not one request.
"invoist/_async_client.py" = ["ASYNC109"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["invoist", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
